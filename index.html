<style>
/* Layout: one column, logo navy, a single "quote request" card as the hero image, then plain sections a tradesperson can scan on a phone */
:root{
  --bg:#ffffff; --surface:#f3f6fc; --ink:#1c2a4a; --muted:#5b6782; --line:#dfe5f1;
  --blue:#2f6bff; --blue-soft:#9fb8ff; --navy:#1c2a4a; --on-blue:#ffffff; --ok:#1f9d63;
  --display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --wrap:1080px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1527; --surface:#16203a; --ink:#e8edf8; --muted:#9aa6c2; --line:#26324f;
  --blue:#5b8cff; --blue-soft:#3c5bab; --navy:#e8edf8; --on-blue:#ffffff; --ok:#3cc487; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1527; --surface:#16203a; --ink:#e8edf8; --muted:#9aa6c2; --line:#26324f;
  --blue:#5b8cff; --blue-soft:#3c5bab; --navy:#e8edf8; --on-blue:#ffffff; --ok:#3cc487; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body)}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2rem,5.2vw,3.4rem);font-weight:800}
h2{font-size:clamp(1.5rem,3.4vw,2.2rem);font-weight:800}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}
.eyebrow{font:600 .78rem/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.brand b{font:800 1.15rem/1 var(--display);letter-spacing:.02em}
.brand span{font:600 .62rem/1 var(--body);letter-spacing:.32em;color:var(--muted);display:block;margin-top:3px}
.langs{display:flex;gap:2px;background:var(--surface);border-radius:999px;padding:3px}
.langs button{border:0;background:none;color:var(--muted);font:600 .8rem/1 var(--body);padding:7px 9px;border-radius:999px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(20,30,60,.15)}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 1rem/1 var(--body);text-decoration:none;padding:14px 20px;border-radius:12px;border:2px solid transparent;cursor:pointer}
.btn-main{background:var(--blue);color:var(--on-blue)}
.btn-main:hover{filter:brightness(1.08)}
.btn-ghost{border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--blue)}
.bar .btn{padding:10px 14px;font-size:.9rem}
@media (max-width:640px){.bar .btn{display:none}}

/* hero */
.hero{padding-block:56px 64px}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.hero .copy{display:grid;gap:20px;min-width:0}
.hero .lead{font-size:1.15rem;color:var(--muted);max-width:34em}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.trial-note{font-size:.92rem;color:var(--muted)}
.trial-note strong{color:var(--ink)}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr}.hero{padding-block:36px 48px}}

/* the quote-request card */
.lead-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:14px;max-width:380px;justify-self:center;width:100%}
.lc-top{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)}
.lc-dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.lc-tag{margin-left:auto;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 8px}
.lc-title{font:700 1.15rem/1.3 var(--display)}
.lc-rows{display:grid;gap:8px;margin:0}
.lc-rows div{display:flex;justify-content:space-between;gap:12px;font-size:.92rem;border-top:1px dashed var(--line);padding-top:8px}
.lc-rows dt{color:var(--muted)}
.lc-rows dd{margin:0;font-weight:600;text-align:right}
.lc-call{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:12px;font-size:.9rem}
.lc-call svg{flex:none}
.bars{display:flex;align-items:flex-end;gap:4px}
.bars i{display:block;width:7px;border-radius:2px}

/* sections */
section{padding-block:64px}
section.alt{background:var(--surface)}
.head{display:grid;gap:10px;margin-bottom:36px;max-width:44em}
.head p{color:var(--muted);font-size:1.05rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.feat{display:grid;gap:10px;align-content:start}
.feat .ico{width:44px;height:44px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--blue)}
section.alt .feat .ico{background:var(--bg)}
.feat p{color:var(--muted)}
@media (max-width:820px){.grid3{grid-template-columns:1fr}}

.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;counter-reset:s}
.steps li{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:8px;align-content:start;counter-increment:s}
.steps li::before{content:counter(s);font:800 1.6rem/1 var(--display);color:var(--blue)}
.steps .when{font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.steps p{color:var(--muted);font-size:.95rem}
@media (max-width:900px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}
.money{margin-top:24px;display:flex;flex-wrap:wrap;gap:12px 28px;font-size:.95rem}
.money span{display:flex;gap:8px;align-items:center}
.money b{font-family:var(--display)}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips li{list-style:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:500}
.chips{padding:0;margin:0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:48px}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.langlist{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.langlist li{display:flex;gap:12px;align-items:baseline}
.langlist code{font:700 .85rem/1 var(--display);background:var(--surface);border-radius:6px;padding:5px 7px;min-width:36px;text-align:center}

.faq{display:grid;gap:12px;max-width:760px}
.faq details{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
.faq summary{font-weight:600;cursor:pointer}
.faq details p{color:var(--muted);margin-top:10px}

.contact{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:760px}
@media (max-width:640px){.contact{grid-template-columns:1fr}}
.cbox{border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:6px;min-width:0}
.cbox .k{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cbox .v{font:700 1.2rem/1.3 var(--display);word-break:break-word;user-select:all}
.cbox a.btn{justify-self:start;margin-top:8px}

footer{border-top:1px solid var(--line);padding-block:28px;color:var(--muted);font-size:.88rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
</style>

function setLang(l){
  const d=T[l]||T.fr;
  document.documentElement.lang=l;
  document.querySelectorAll("[data-t]").forEach(el=>{const v=d[el.dataset.t]; if(v!=null) el.innerHTML=v;});
  const ul=document.querySelector('[data-list="trades"]'); ul.innerHTML=""; d.trades.forEach(t=>{const li=document.createElement("li"); li.textContent=t; ul.appendChild(li);});
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===l));
  try{localStorage.setItem("pop-lang",l)}catch(e){}
}
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
let start="fr";
try{const s=localStorage.getItem("pop-lang"); if(s&&T[s]) start=s; else {const n=(navigator.language||"").slice(0,2); if(T[n]) start=n;}}catch(e){}
setLang(start);
</script>
